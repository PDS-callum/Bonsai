# Data for measuring a tree's quality on the potting bench.
#
#   wiki.test.raw              WikiText-2 test set: perplexity, and KL divergence
#                              from the seed's own predictions
#   arc-combined-validation    ARC (Easy and Challenge) validation questions in
#                              llama-perplexity's multiple-choice format
#   gsm8k-test.jsonl           GSM8K test problems: grade-school maths, solved
#                              step by step
#
# The first two come from llama.cpp's validation datasets; GSM8K from OpenAI's
# release. Each is pinned to a fixed revision and checked by SHA-256. Changing
# any of them would change every score, so a new set gets a new manifest.

name = "quality-v1"
kind = "data"
license = "WikiText: CC BY-SA 3.0; ARC: CC BY-SA 4.0; GSM8K: MIT"

